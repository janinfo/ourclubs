<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#201f2b">
<title>myclubs Tageskarte</title>
<style>
:root{--ink:#201f2b;--green:#66a65a;--paper:#fff;--cream:#fbe3d0;--grey:#9a9a9a;--tab:#b9b9bd;
box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--ink)}
header{position:relative;flex:none;padding-top:env(safe-area-inset-top,0px);height:calc(clamp(56px,8vh,72px) + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:center;color:#fff}
.logo{font-size:34px;font-weight:800;font-style:italic;letter-spacing:-1.5px}
.logo span{font-weight:500}
.close{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:48px;height:48px;padding:10px}
main{flex:1 1 0;min-height:0;padding:8px 18px 14px;display:flex;align-items:stretch}
.card{flex:1;width:100%;min-height:0;border-radius:18px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{flex:0 0 60%;background:var(--green);color:#fff;text-align:center;padding:clamp(52px,10.5vh,90px) 16px 0;position:relative}
.badge{position:absolute;left:18px;top:18px;width:56px;height:56px;pointer-events:none}
.stage{position:absolute;left:0;top:0;width:369px;height:369px;transform:scale(.1518);transform-origin:0 0}
.flip{position:absolute;left:45.6px;top:33.1px;width:280.8px;height:280.8px;transform:scaleX(-1)}
.ring{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,rgba(32,31,43,0) 0%,rgba(32,31,43,0) 15%,rgba(32,31,43,.12) 19%,rgba(32,31,43,.5) 24%,rgb(32,31,43) 32%,rgb(32,31,43) 68%,rgba(32,31,43,.5) 76%,rgba(32,31,43,.12) 81%,rgba(32,31,43,0) 85%,rgba(32,31,43,0) 100%);-webkit-mask-image:radial-gradient(farthest-side,transparent 128.7px,#000 130.5px);mask-image:radial-gradient(farthest-side,transparent 128.7px,#000 130.5px);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.medal{position:absolute;left:82px;top:69.5px;width:208px;height:208px;transform-style:preserve-3d;animation:flipcoin 5s ease-in-out infinite}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front img{position:absolute;left:12px;top:36.4px;width:181.6px;height:143.2px}
.back{transform:rotateY(180deg);border-radius:50%;background:#201f2b}
.back svg{width:100%;height:100%}
@keyframes flipcoin{0%,28%{transform:perspective(900px) rotateY(0)}45%,78%{transform:perspective(900px) rotateY(180deg)}95%,100%{transform:perspective(900px) rotateY(360deg)}}

.stamp{position:absolute;right:22px;top:34px;color:#fff;font-size:20.4px;font-weight:500;letter-spacing:.3px;font-variant-numeric:tabular-nums}
h1{text-wrap:balance;margin:0 0 clamp(6px,1.4vh,12px);font-size:clamp(21px,min(8vw,4.2vh),33px);line-height:1.2;font-weight:900;font-style:italic;text-transform:uppercase}
.top p{margin:0;font-size:clamp(13px,min(4.6vw,2.5vh),20px);line-height:1.4;color:rgba(255,255,255,.78)}
.avatar{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);width:clamp(108px,21vh,186px);height:clamp(108px,21vh,186px);border-radius:50%;background:var(--ink);border:4px solid #fff;display:grid;place-items:center}
.avatar svg{width:38%;height:38%}
.bottom{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:calc(clamp(108px,21vh,186px)/2 + 6px);text-align:center}
.name{font-size:clamp(24px,4.2vh,34px);font-weight:800;color:#000;letter-spacing:.5px}
.num{margin-top:6px;font-size:clamp(17px,3vh,24px);color:var(--grey);letter-spacing:1px}
nav{background:#fff;display:flex;justify-content:space-around;align-items:center;padding:clamp(8px,1.8vh,16px) 0 calc(clamp(2px,.5vh,4px) + env(safe-area-inset-bottom,0px))}
nav svg{width:clamp(24px,3.7vh,30.4px);height:clamp(24px,3.7vh,30.4px);stroke:var(--tab);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
nav .home{width:clamp(24px,3.7vh,30.4px);height:clamp(24px,3.7vh,30.4px);display:block;opacity:.3}
nav .on svg{stroke:var(--ink)}
#fsExit{cursor:pointer;pointer-events:auto}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);z-index:10;width:max-content;max-width:86%;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.96);color:#201f2b;font:500 14px/1.4 "Helvetica Neue",Arial,sans-serif;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#hint.on{opacity:1}
[hidden]{display:none!important}
.sel{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 14px;display:block}
.panel{width:100%;background:#fff;border-radius:18px;padding:24px 20px 22px;color:#201f2b}
.panel h2{margin:0 0 16px;font-size:26px;font-weight:900;font-style:italic;text-transform:uppercase}
.studio{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px;border:2px solid #e3e3e6;border-radius:14px;background:#fff;color:inherit;font:inherit;cursor:pointer}
.studio b{display:block;font-size:17px}
.studio span{display:block;margin-top:2px;font-size:14px;color:var(--grey)}
.studio[aria-checked="true"]{border-color:var(--green);background:#eef6ec}
.panel label{display:block;margin:18px 0 6px;font-size:14px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.6px}
.panel input{width:100%;padding:14px 16px;border:2px solid #e3e3e6;border-radius:14px;font:500 18px "Helvetica Neue",Arial,sans-serif;color:#201f2b;background:#fff;outline:none}
.panel input:focus{border-color:var(--green)}
#go{display:block;width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:var(--green);color:#fff;font:800 18px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
#go:disabled{opacity:.45;cursor:default}
.name{padding:0 16px;max-width:100%;line-height:1.15;overflow-wrap:anywhere;text-transform:uppercase}
@media (prefers-color-scheme:dark){body{background:#14131a}}
</style>
</head>

(function(){

  b.addEventListener("click",enter);
  b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();enter();}});
  var STUDIOS=[

    {n:"Holmes Place Millennium",a:"Wehlistraße 66, 1200 Wien"}

  function paint(){Array.prototype.forEach.call(list.children,function(el,i){el.setAttribute("aria-checked",i===sel?"true":"false");});}
  paint();

  $("numIn").addEventListener("keydown",function(e){if(e.key==="Enter"&&!go.disabled){e.preventDefault();showCard();}});
  nameIn.addEventListener("keydown",function(e){if(e.key==="Enter"&&!go.disabled){e.preventDefault();showCard();}});
